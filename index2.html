<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.grad{background-image:linear-gradient(90deg,#facc15,#ef4444,#0284c7,#facc15);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.grad2{background-image:linear-gradient(90deg,#0284c7,#16a34a,#facc15,#0284c7);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.pop{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.cf{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx,0px),110vh) rotate(720deg)}}
#app>*{animation:rise .55s ease-out backwards}
#app>*:nth-child(2){animation-delay:.06s}#app>*:nth-child(3){animation-delay:.12s}#app>*:nth-child(4){animation-delay:.18s}#app>*:nth-child(5){animation-delay:.24s}#app>*:nth-child(6){animation-delay:.3s}#app>*:nth-child(7){animation-delay:.36s}#app>*:nth-child(8){animation-delay:.42s}
#app>.grad,#app>.grad2{animation:rise .55s ease-out backwards,flow 6s linear infinite}
#app>.pop{animation:pop .6s ease-out,bob 3s ease-in-out .6s infinite}
#app>.wave{transform-origin:70% 70%;animation:rise .5s ease-out backwards,waveh 1.8s ease-in-out .5s infinite}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes flow{to{background-position:200% 0}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes waveh{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(18deg)}20%,40%{transform:rotate(-12deg)}}
.tile{animation:rise .5s ease-out backwards}
.tile:nth-child(1){animation-delay:.12s}.tile:nth-child(2){animation-delay:.2s}.tile:nth-child(3){animation-delay:.28s}.tile:nth-child(4){animation-delay:.36s}
.tile:hover span{animation:wiggle .6s ease-in-out}
@keyframes wiggle{25%{transform:rotate(-12deg) scale(1.2)}75%{transform:rotate(12deg) scale(1.2)}}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-100%)}
.shine:hover::after{transform:translateX(100%);transition:transform .7s}
#sd:not(:disabled){position:relative}
#sd:not(:disabled)::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 16px rgba(34,197,94,0)}}
.hue{animation:hue 20s ease-in-out infinite alternate}
@keyframes hue{to{filter:hue-rotate(25deg)}}
.f1{animation:float 9s ease-in-out infinite}.f2{animation:float 12s ease-in-out infinite reverse}
@keyframes float{50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

 var ts=app.querySelectorAll(".tile");
 Array.prototype.forEach.call(ts,function(b){b.onclick=function(){
